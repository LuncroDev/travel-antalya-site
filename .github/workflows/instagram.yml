name: Refresh Instagram feed
on:
  schedule:
    - cron: '0 5 * * 1'   # every Monday 05:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-instagram.js
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "travel-antalya-bot"
          git config user.email "bot@travel-antalya.com"
          git add _data/instagram.json
          git diff --cached --quiet || (git commit -m "Refresh #antalya Instagram feed" && git push)
